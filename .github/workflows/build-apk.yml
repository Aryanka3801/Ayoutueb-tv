name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mobile Debug APK
        run: ./gradlew :mobile:assembleDebug

      - name: Build TV Debug APK
        run: ./gradlew :tv:assembleDebug

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-debug-apk
          path: tv/build/outputs/apk/debug/tv-debug.apk
